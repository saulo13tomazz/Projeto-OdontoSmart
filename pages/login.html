<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OdontoSmart - Entrar</title>
  <link rel="stylesheet" href="../css/base.css"><link rel="stylesheet" href="../css/components.css">
</head>
<body class="login">
  <div class="login-box">
    <div class="login-logo"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3c-2 0-3.5 1.6-3.5 4 0 3 1.5 4.5 2 8 .3 2.5.8 6 2.5 6 1.5 0 1.6-3.5 2.2-5.5.3-1 .8-1.5 1.8-1.5s1.5.5 1.8 1.5c.6 2 .7 5.5 2.2 5.5 1.7 0 2.2-3.5 2.5-6 .5-3.5 2-5 2-8 0-2.4-1.5-4-3.5-4-1.8 0-2.7 1-5 1S8.8 3 7 3z"/></svg></div>
    <h1>OdontoSmart</h1>
    <p class="sub">Passo 0 · Escolha a equipe (INE) e o perfil. Toda a produção alimenta a meta da equipe selecionada.</p>
    <div class="form-grid" style="grid-template-columns:1fr">
      <div class="form-group"><label for="sel-ine">Equipe / INE</label><select id="sel-ine" class="form-control"></select></div>
      <div class="form-group"><label for="sel-perfil">Perfil</label>
        <select id="sel-perfil" class="form-control"><option value="CD">Cirurgião-Dentista</option><option value="TSB">Técnico em Saúde Bucal (TSB)</option></select></div>
      <div class="form-group"><label for="sel-prof">Profissional</label><select id="sel-prof" class="form-control"></select></div>
    </div>
    <div id="login-aviso"></div>
    <button id="btn-entrar" class="btn btn-primary" style="width:100%">Entrar</button>
    <p class="login-foot">Indicadores de Saúde Bucal · e-SUS APS</p>
  </div>
  <script src="../js/core/util.js"></script><script src="../js/core/seed.js"></script><script src="../js/core/store.js"></script>
  <script src="../js/pages/login.js"></script>
</body>
</html>
