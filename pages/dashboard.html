<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OdontoSmart - Dashboard</title>
  <link rel="stylesheet" href="../css/base.css"><link rel="stylesheet" href="../css/components.css">
</head>
<body>
  <div id="app-header"></div>
  <div class="container">
    <aside id="app-menu"></aside>
    <main>
      <div class="dash-top">
        <div>
          <h2 class="page-title">Indicadores de Saúde Bucal (Série B)</h2>
          <p class="page-subtitle" id="dash-sub"></p>
        </div>
        <div class="toolbar" style="margin-bottom:0">
          <div class="form-group"><label for="f-periodo">Período</label><select id="f-periodo" class="form-control"></select></div>
          <div class="form-group"><label for="f-prof">Profissional</label><select id="f-prof" class="form-control"></select></div>
        </div>
      </div>

      <div id="dash-score"></div>
      <div class="indicators-grid" id="dash-grid"></div>
    </main>
  </div>
  <div id="app-footer"></div>
  <script src="../js/core/util.js"></script><script src="../js/core/seed.js"></script><script src="../js/core/store.js"></script>
  <script src="../js/services/indicadores.js"></script><script src="../js/ui/layout.js"></script><script src="../js/ui/componentes.js"></script>
  <script src="../js/pages/dashboard.js"></script>

</html>
