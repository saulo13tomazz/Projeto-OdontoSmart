<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OdontoSmart - Pacientes</title>
  <link rel="stylesheet" href="../css/base.css"><link rel="stylesheet" href="../css/components.css">
</head>
<body>
  <div id="app-header"></div>
  <div class="container">
    <aside id="app-menu"></aside>
    <main>
      <h2 class="page-title">Pacientes Cadastrados & Indicadores Vinculados</h2>
      <p class="page-subtitle">Pacientes da base local (importada do e-SUS) e cidadãos já atendidos em indicadores, com as datas de cada registro.</p>

      <div class="card">
        <div class="card-header"><span>Consulta de pacientes</span><a class="btn btn-primary btn-sm" href="atendimento.html?novo=1">+ Cadastrar novo paciente</a></div>
        <p id="pac-resumo" style="font-size:13px;color:#475569;margin-bottom:15px"></p>
        <div class="toolbar">
          <div class="form-group" style="flex:1"><label for="pac-busca">Buscar por CPF, CNS, NIS ou nome</label><input id="pac-busca" class="form-control" type="search" autocomplete="off"></div>
          <div class="form-group"><label for="pac-filtro">Filtro</label>
            <select id="pac-filtro" class="form-control">
              <option value="todos">Todos</option><option value="com">Atendidos em indicadores</option><option value="sem">Sem indicador no período</option>
              <option value="cri">Crianças 6 a 12 anos</option><option value="ges">Gestantes</option><option value="dia">Diabéticos</option>
            </select></div>
        </div>
        <div id="pac-lista"></div>
        <div style="text-align:center;margin-top:12px"><button id="pac-mais" class="btn btn-secondary" hidden>Mostrar mais</button></div>
      </div>
    </main>
  </div>
  <div id="app-footer"></div>
  <script src="../js/core/util.js"></script><script src="../js/core/seed.js"></script><script src="../js/core/store.js"></script>
  <script src="../js/services/indicadores.js"></script><script src="../js/ui/layout.js"></script><script src="../js/ui/componentes.js"></script>
  <script src="../js/pages/pacientes.js"></script>
</body>
</html>
