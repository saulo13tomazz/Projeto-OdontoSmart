<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OdontoSmart - Relatórios</title>
  <link rel="stylesheet" href="../css/base.css"><link rel="stylesheet" href="../css/components.css">
</head>
<body>
  <div id="app-header"></div>
  <div class="container">
    <aside id="app-menu"></aside>
    <main>
      <h2 class="page-title">Relatórios & Listas de Busca Ativa</h2>
      <p class="page-subtitle">Listas de pendências para a equipe e os ACS: quem ainda falta atender para cada indicador.</p>
      <div class="card">
        <div class="toolbar">
          <div class="form-group"><label for="r-tipo">Lista</label>
            <select id="r-tipo" class="form-control">
              <option value="b1">B1 · Sem 1ª consulta nos últimos 12 meses</option>
              <option value="b2">B2 · Casos ativos aguardando alta</option>
              <option value="atraso">Retornos atrasados</option>
              <option value="b4">B4 · Crianças sem escovação supervisionada</option>
            </select></div>
          <button class="btn btn-secondary" id="r-csv" type="button">Exportar CSV</button>
        </div>
        <p id="r-info" style="font-size:13px;color:#475569"></p>
        <div id="r-tabela" class="table-scroll"></div>
      </div>
    </main>
  </div>
  <div id="app-footer"></div>
  <script src="../js/core/util.js"></script><script src="../js/core/seed.js"></script><script src="../js/core/store.js"></script>
  <script src="../js/services/indicadores.js"></script><script src="../js/ui/layout.js"></script><script src="../js/ui/componentes.js"></script>
  <script src="../js/pages/relatorios.js"></script>
</body>
</html>
